interface:
  display_name: "Simplified Agents"
  short_description: "Build, change and run AI agents in Simplified."
  default_prompt: "Use $simplified-agents to build me an agent for a job I do every week."

dependencies:
  tools:
    - type: "mcp"
      value: "simplified-automation"
      description: "Simplified automation connector for workflows, agents, and REST passthrough; requires this separate connection to be enabled."
      transport: "http"
      url: "https://apikit.simplified.com/automation/mcp"

policy:
  allow_implicit_invocation: true
