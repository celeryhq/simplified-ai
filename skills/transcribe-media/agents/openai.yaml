interface:
  display_name: "Transcribe Media"
  short_description: "Transcribe recordings and export SRT or VTT."
  default_prompt: "Use $transcribe-media to transcribe my uploaded recording and deliver SRT subtitles."
dependencies:
  tools:
    - type: "mcp"
      value: "simplified"
      description: "Simplified hosted MCP connector for media and assets."
      transport: "http"
      url: "https://apikit.simplified.com/mcp"
policy:
  allow_implicit_invocation: true
